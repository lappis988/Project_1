<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="app-title">To Do List</h1>
    <div class="app-container">
        <div class="left-panel">
            <div class="card">
                <h2 class="card-title">Add task</h2>
                <form id="add-task-form" class="task-form">
                    <input type="text" id="task-input" class="task-input" placeholder="Write task here" required autocomplete="off"/>
                    <button type="submit" class="btn-add">Add</button>
                </form>
            </div>

            <div class="card counter-card">
                Completed: <span id="completed-count">0</span> / <span id="total-count">0</span>
            </div>
        </div>

        <div class="right-panel">
            <h2 class="card-title">Task List</h2>
            <ul id="task-list" class="task-list"></ul>
        </div>

    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
